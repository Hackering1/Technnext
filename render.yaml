services:
  - type: web
    name: technext-pay-test
    runtime: docker
    plan: free
    dockerfilePath: ./technext-pay/Dockerfile
    dockerContext: ./technext-pay
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_SSL_MODE
        value: disable
      - key: PUBLIC_BASE_URL
        value: https://technext-pay-test.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://technext-pay-test.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://technext-pay-frontend.onrender.com
      - key: API_KEY_PEPPER
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: technext-pay-test-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: technext-pay-test-redis
          type: keyvalue
          property: connectionString

  - type: web
    name: technext-pay-frontend
    runtime: static
    rootDir: ./technext-pay
    plan: free
    buildCommand: echo "Publishing TechNext Pay frontend"
    staticPublishPath: public

  - type: keyvalue
    name: technext-pay-test-redis
    plan: free
    ipAllowList: []

databases:
  - name: technext-pay-test-db
    databaseName: technext_pay
    user: technext_pay
    plan: free

