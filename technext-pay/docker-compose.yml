# Local development dependencies only. Do not use these credentials or this
# topology as a production deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: technext_pay
      POSTGRES_USER: technext
      POSTGRES_PASSWORD: dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technext -d technext_pay"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

