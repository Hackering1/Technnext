name: TechNext Pay platform build
on:
  push:
    paths:
      - 'technext-pay/backend/**'
      - 'technext-pay/frontend/merchant-portal/**'
      - 'technext-pay/docker-compose.yml'
      - 'technext-pay/.github/workflows/platform-build.yml'
  pull_request:
    paths:
      - 'technext-pay/backend/**'
      - 'technext-pay/frontend/merchant-portal/**'
      - 'technext-pay/docker-compose.yml'
      - 'technext-pay/.github/workflows/platform-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -f technext-pay/backend/pom.xml test
  merchant-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: technext-pay/frontend/merchant-portal
      - run: npm run build
        working-directory: technext-pay/frontend/merchant-portal

