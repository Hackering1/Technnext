spring:
  application.name: technext-pay-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/technext_pay}
    username: ${DATABASE_USER:technext}
    password: ${DATABASE_PASSWORD:dev-only-change-me}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${PAYMENT_SCHEMA:public}
  flyway.enabled: true
  data.redis.url: ${REDIS_URL:redis://localhost:6379}
  kafka.bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
  kafka.admin.auto-create: false
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
technext.jwt-secret: ${JWT_SECRET}
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true

